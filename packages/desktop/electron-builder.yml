appId: dev.nexus.app
productName: Nexus
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
asarUnpack:
  # nexus-helper is executed by Electron-as-Node as a real file path (D14), so
  # it must live outside the asar archive.
  - out/main/helper.js
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns # generated by `pnpm brand` from assets/logos/nexus-app-icon.svg
  target:
    - dir
  # Signing and notarisation are set up in M5.
  identity: null
