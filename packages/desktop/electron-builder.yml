# Bundle id matches the (free, owned) GitHub namespace; it was changed before
# any signed release, while no user's keychain/TCC entries depend on it.
appId: io.github.6ikun6.nexus
productName: Nexus
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
asarUnpack:
  # nexus-helper is executed by Electron-as-Node as a real file path (D14), so
  # it must live outside the asar archive.
  - out/main/helper.js
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns # generated by `pnpm brand` from assets/logos/nexus-app-icon.svg
  target:
    - dir
  # Unsigned on purpose for the v0.2 beta (decision 2026-11-18); signing +
  # notarisation flip on per docs/distribution.md once an Apple Developer
  # certificate is available. entitlements.mac.plist is already prepared.
  identity: null
