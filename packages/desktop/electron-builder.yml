appId: dev.nexus.app
productName: Nexus
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns # generated by `pnpm brand` from assets/logos/nexus-app-icon.svg
  target:
    - dir
  # Signing and notarisation are set up in M5.
  identity: null
